[project]
name = "deepscout-api"
version = "0.1.0"
description = "Bounded, source-backed research API"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

