name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r apps/api/requirements.txt pytest ruff pip-audit
      - run: ruff check apps/api evals
      - run: pip-audit -r apps/api/requirements.txt --strict
      - run: pytest
      - run: python evals/run_eval.py --cases evals/cases.jsonl --output /tmp/deepscout-eval.json --baseline evals/baselines/demo.json --fail-on-regression

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm audit --audit-level=high
        working-directory: apps/web
